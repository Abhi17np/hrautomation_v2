<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infopace HR, all of HR in one place</title>
    <meta name="description" content="Employee records, leave, approvals, letters, attendance and payslips, handled in one system your whole team can use." />
    <link rel="icon" href="/infopace-logo.webp" />
    <link rel="preload" href="/fonts/Geist-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The hero visual is the LCP element. The page renders on the client, so
         without these the browser cannot discover the image until React runs. -->
    <link rel="preload" as="image" type="image/avif" fetchpriority="high"
          media="(min-width: 768px)"
          href="/shots/employees-1600.avif"
          imagesrcset="/shots/employees-800.avif 800w, /shots/employees-1600.avif 1600w, /shots/employees-2400.avif 2400w"
          imagesizes="(max-width: 1439px) 94vw, 1400px" />
    <link rel="preload" as="image" type="image/avif" fetchpriority="high"
          media="(max-width: 767px)"
          href="/shots/employees-m-900.avif"
          imagesrcset="/shots/employees-m-600.avif 600w, /shots/employees-m-900.avif 900w, /shots/employees-m-1300.avif 1300w"
          imagesizes="92vw" />
    <link rel="preload" href="/fonts/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:title" content="Infopace HR, all of HR in one place" />
    <meta property="og:description" content="Employee records, leave, approvals, letters, attendance and payslips, handled in one system your whole team can use." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/shots/employees-1600.webp" />
    <meta name="theme-color" content="#FBFBFD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />
    <script>
      // Applied before paint so a stored choice never flashes the wrong theme.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
